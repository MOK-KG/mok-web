server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Проверка живости для Coolify
  location = /health {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # Файлы с хешем в имени — кэшируем навсегда
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # TODO: когда появится бэкенд — проксировать /api на него или задать VITE_API_URL
  # location /api/ { proxy_pass http://backend:8000/; }

  # SPA: все остальные пути отдаёт index.html, маршрутизацию делает React Router
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
